<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Téléchargements — Sortie Officielle</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #262b38;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 2rem 1rem; line-height: 1.5; }
    .container { max-width: 820px; margin: 0 auto; }
    header { margin-bottom: 1.75rem; }
    header h1 { font-size: 1.8rem; margin-bottom: 0.35rem; }
    header p { color: var(--muted); }
    .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    input[type="search"], select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
    }
    input[type="search"] { flex: 1; min-width: 220px; }
    .list { display: grid; gap: 1rem; }
    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .meta { font-size: 0.85rem; color: var(--muted); margin-top: 0.25rem; }
    .btn {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-block;
    }
    .btn:hover { background: var(--accent-hover); }
    .empty { color: var(--muted); text-align: center; padding: 2rem; background: var(--card); border-radius: 10px; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Catalogue de Téléchargement</h1>
      <p>Tape le nom du son ou du fichier pour le retrouver et le télécharger directement.</p>
    </header>

    <div class="controls">
      <input id="searchInput" type="search" placeholder="Rechercher un titre, un artiste, un fichier..." aria-label="Rechercher" />
      <select id="categoryFilter" aria-label="Filtrer par catégorie">
        <option value="all">Toutes les catégories</option>
        <option value="Audio">Audio (MP3 / WAV)</option>
        <option value="Bonus">Bonus / Pack</option>
      </select>
    </div>

    <div id="results" class="list"></div>
  </div>

  <script>
    const tracks = [
      {
        title: "Titre du Son (Extrait / Version Studio)",
        artist: "Artiste",
        category: "Audio",
        format: "MP3 • 320 kbps",
        size: "7.8 Mo",
        url: "#lien-telechargement-son"
      },
      {
        title: "Instrumental / Version Propre",
        artist: "Artiste",
        category: "Audio",
        format: "MP3 • 320 kbps",
        size: "7.4 Mo",
        url: "#lien-telechargement-instru"
      },
      {
        title: "Pochette & Paroles",
        artist: "Artiste",
        category: "Bonus",
        format: "ZIP",
        size: "4.2 Mo",
        url: "#lien-telechargement-bonus"
      }
    ];

    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const resultsEl = document.getElementById("results");

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      const cat = categoryFilter.value;

      const filtered = tracks.filter(item => {
        const matchesCat = cat === "all" || item.category === cat;
        const haystack = ${item.title} ${item.artist} ${item.format} ${item.category}.toLowerCase();
        const matchesQuery = !q || haystack.includes(q);
        return matchesCat && matchesQuery;
      });

      if (filtered.length === 0) {
        resultsEl.innerHTML = <div class="empty">Aucun résultat pour « ${searchInput.value} ». Vérifie l'orthographe du titre.</div>;
        return;
      }

      resultsEl.innerHTML = filtered.map(item => `
        <article class="item">
          <div>
            <strong>${item.title}</strong>
            <div class="meta">${item.artist} • ${item.category} • ${item.format} (${item.size})</div>
          </div>
          <a class="btn" href="${item.url}" download>Télécharger</a>
        </article>
      `).join("");
    }

    searchInput.addEventListener("input", render);
    categoryFilter.addEventListener("change", render);
    render();
  </script>
</body>
</html>
