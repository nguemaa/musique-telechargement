<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sortie Officielle — Catalogue Audio & Téléchargement</title>
  <style>
    :root {
      --bg: #090b10;
      --surface: #111622;
      --surface-2: #171e2e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f97316;
      --accent-2: #3b82f6;
      --accent-hover: #ea580c;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(249, 115, 22, 0.16), transparent 35%),
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.14), transparent 35%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      line-height: 1.5;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
    }

    .hero {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.14), rgba(59, 130, 246, 0.12));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem 1.5rem;
      margin-bottom: 1.75rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .badge {
      display: inline-block;
      background: rgba(249, 115, 22, 0.18);
      color: #fdba74;
      border: 1px solid rgba(249, 115, 22, 0.35);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 0.85rem;
    }

    .hero h1 {
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--muted);
      max-width: 640px;
      font-size: 1rem;
    }

    .player-box {
      margin-top: 1.35rem;
      background: rgba(9, 11, 16, 0.65);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.95rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .player-label {
      font-size: 0.88rem;
      color: #e2e8f0;
      font-weight: 600;
    }

    audio {
      width: 100%;
      height: 38px;
    }

    .controls {
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    input[type="search"],
    select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="search"]:focus,
    select:focus {
      border-color: var(--accent);
    }

    input[type="search"] {
      flex: 1;
      min-width: 240px;
    }

    .list {
      display: grid;
      gap: 1rem;
    }

    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .item:hover {
      transform: translateY(-2px);
      background: var(--surface-2);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
    }

    .meta {
      font-size: 0.86rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .btn-preview {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.62rem 0.95rem;
      border-radius: 9px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .btn-preview:hover {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .btn {
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      padding: 0.65rem 1.05rem;
      border-radius: 9px;
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-block;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 2.25rem;
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    footer {
      margin-top: 2.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.84rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <span class="badge">Sortie Officielle • Téléchargement Direct</span>
      <h1>Catalogue Officiel des Sons</h1>
      <p>Écoute un aperçu, filtre par catégorie et télécharge directement les morceaux, instrumentaux et packs bonus de la sortie.</p>

      <div class="player-box">
        <div class="player-label" id="nowPlaying">Aperçu : Sélectionne un titre ci-dessous</div>
        <audio id="audioPlayer" controls preload="none">
          Votre navigateur ne supporte pas la lecture audio HTML5.
        </audio>
      </div>
    </section>

    <div class="controls">
      <input id="searchInput" type="search" placeholder="Rechercher un titre, un artiste, un format..." aria-label="Rechercher" />
      <select id="categoryFilter" aria-label="Filtrer par catégorie">
        <option value="all">Toutes les catégories</option>
        <option value="Audio">Audio (MP3 / WAV)</option>
        <option value="Bonus">Bonus / Pack</option>
      </select>
    </div>

    <div id="results" class="list"></div>

    <footer>
      Propulsé par GitHub Pages • Mis à jour en direct pour la sortie
    </footer>
  </div>

  <script>
    const tracks = [
      {
        title: "Titre Principal (Version Studio)",
        artist: "Artiste Officiel",
        category: "Audio",
        format: "MP3 • 320 kbps",
        size: "8.4 Mo",
        previewUrl: "",
        downloadUrl: "#lien-telechargement-1"
      },
      {
        title: "Version Instrumentale",
        artist: "Artiste Officiel",
        category: "Audio",
        format: "MP3 • 320 kbps",
        size: "7.9 Mo",
        previewUrl: "",
        downloadUrl: "#lien-telechargement-2"
      },
      {
        title: "Pack Visuel, Pochette & Paroles",
        artist: "Artiste Officiel",
        category: "Bonus",
        format: "ZIP",
        size: "5.1 Mo",
        previewUrl: "",
        downloadUrl: "#lien-telechargement-3"
      }
    ];

    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const resultsEl = document.getElementById("results");
    const audioPlayer = document.getElementById("audioPlayer");
    const nowPlaying = document.getElementById("nowPlaying");

    function playPreview(index) {
      const track = tracks[index];
      if (!track) return;
      nowPlaying.textContent = Aperçu : ${track.title} — ${track.artist};
      if (track.previewUrl) {
        audioPlayer.src = track.previewUrl;
        audioPlayer.play().catch(() => {});
      }
    }

    function render() {
      const q = searchInput.value.trim().toLowerCase();
      const cat = categoryFilter.value;

      const filtered = tracks
        .map((item, idx) => ({ item, idx }))
        .filter(({ item }) => {
          const matchesCat = cat === "all" || item.category === cat;
          const haystack = ${item.title} ${item.artist} ${item.format} ${item.category}.toLowerCase();
          const matchesQuery = !q || haystack.includes(q);
          return matchesCat && matchesQuery;
        });

      if (filtered.length === 0) {
        resultsEl.innerHTML = <div class="empty">Aucun titre trouvé pour « ${searchInput.value} ». Essaie un autre mot-clé.</div>;
        return;
      }

      resultsEl.innerHTML = filtered.map(({ item, idx }) => `
        <article class="item">
          <div>
            <div class="title-row">
              <strong>${item.title}</strong>
              <span class="tag">${item.category}</span>
            </div>
            <div class="meta">${item.artist} • ${item.format} • ${item.size}</div>
          </div>
          <div class="actions">
            ${item.category === "Audio" ? <button class="btn-preview" type="button" onclick="playPreview(${idx})">Écouter</button> : ""}
            <a class="btn" href="${item.downloadUrl}" download>Télécharger</a>
          </div>
        </article>
      `).join("");
    }

    searchInput.addEventListener("input", render);
    categoryFilter.addEventListener("change", render);
    render();
  </script>
</body>
</html>
